<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>LegSim Simulation 06</title>
  <link rel="icon" href="../favicon.ico" />
  <link rel="stylesheet" href="legsim.css" />
  <style>
    .app {
      padding-top: 10px;
      padding-bottom: 24px;
      gap: 10px;
    }
    .hero {
      grid-template-columns: 1fr;
      gap: 4px;
    }
    .card {
      padding: 10px;
    }
    .controls {
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px 10px;
    }
    .control-group label {
      margin-bottom: 3px;
      font-size: 0.9rem;
    }
    .subhead {
      margin: 0;
      line-height: 1.1;
      font-size: 0.92rem;
    }
    .sim06-title {
      font-size: clamp(1.05rem, 1.4vw, 1.45rem);
      margin: 0;
    }
    .sim06-version {
      margin: 2px 0 0;
      color: var(--muted, #5c5c5c);
      font-size: 0.8rem;
      line-height: 1.1;
    }
    #sim-bed-canvas,
    #sim-angle-canvas {
      height: 430px;
    }
    .sim06-links-row {
      display: flex;
      gap: 8px;
    }
    .sim06-edit {
      width: 72px;
      padding: 5px 7px;
      border: 1px solid var(--border, #cdddf2);
      border-radius: 10px;
      background: #fff;
      font: inherit;
      text-align: right;
    }
    .slider-row {
      gap: 8px;
    }
    .value-badge {
      min-width: 50px;
      padding: 5px 8px;
      font-size: 0.84rem;
    }
    .control-group select,
    .control-group button {
      padding: 8px 10px;
      font-size: 0.9rem;
    }
    .plot-card header {
      margin-bottom: 8px;
    }
    .plot-card h2 {
      margin: 0 0 2px;
      font-size: 1rem;
    }
    .plot-card p {
      font-size: 0.84rem;
      line-height: 1.15;
    }
    @media (max-width: 1100px) {
      .controls {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
    @media (max-width: 760px) {
      .controls {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="hero">
      <div class="hero-text">
        <h2 class="sim06-title">Supine Knee Flexion Simulation 06</h2>
        <p class="sim06-version">Version 06.6 - uniform bed scaling</p>
      </div>
    </header>

    <section class="card">
      <p id="sim-status" class="subhead">Cycle 0.00 | Hip 0.0 deg | Knee 0.0 deg | Clearance 0.000 m</p>
    </section>

    <section class="controls card">
      <div class="control-group">
        <label for="sim-human-height">Human height (m)</label>
        <div class="slider-row">
          <input id="sim-human-height" type="range" min="1.18" max="2.20" step="0.01" />
          <input id="sim-human-height-edit" class="sim06-edit" type="number" min="1.18" max="2.20" step="0.01" />
          <span id="sim-human-height-val" class="value-badge"></span>
        </div>
      </div>

      <div class="control-group">
        <label for="sim-l1">Thigh length L1 (m)</label>
        <div class="slider-row">
          <input id="sim-l1" type="range" min="0.30" max="0.65" step="0.001" />
          <input id="sim-l1-edit" class="sim06-edit" type="number" min="0.30" max="0.65" step="0.001" />
          <span id="sim-l1-val" class="value-badge"></span>
          <span id="sim-l1-pct" class="value-badge"></span>
        </div>
      </div>

      <div class="control-group">
        <label for="sim-l2">Shank length L2 (m)</label>
        <div class="slider-row">
          <input id="sim-l2" type="range" min="0.28" max="0.52" step="0.001" />
          <input id="sim-l2-edit" class="sim06-edit" type="number" min="0.28" max="0.52" step="0.001" />
          <span id="sim-l2-val" class="value-badge"></span>
          <span id="sim-l2-pct" class="value-badge"></span>
        </div>
      </div>

      <div class="control-group">
        <label for="sim-speed">Speed factor</label>
        <div class="slider-row">
          <input id="sim-speed" type="range" min="0.3" max="2.0" step="0.1" />
          <span id="sim-speed-val" class="value-badge"></span>
        </div>
      </div>

      <div class="control-group">
        <label for="sim-cycle">Cycle position</label>
        <div class="slider-row">
          <input id="sim-cycle" type="range" min="0" max="1" step="0.001" />
          <span id="sim-cycle-val" class="value-badge"></span>
        </div>
      </div>

      <div class="control-group">
        <label for="sim-knee-factor">Knee constraint</label>
        <div class="slider-row">
          <select id="sim-knee-factor">
            <option value="-2" selected>-2 x hip</option>
            <option value="-1">-1 x hip</option>
            <option value="0">0 x hip</option>
          </select>
          <span id="sim-knee-max-val" class="value-badge"></span>
        </div>
      </div>

      <div class="control-group">
        <label for="sim-hip-max">Hip flexion max (deg)</label>
        <div class="slider-row">
          <input id="sim-hip-max" type="range" min="0" max="70" step="1" />
          <span id="sim-hip-max-val" class="value-badge"></span>
        </div>
      </div>

      <div class="control-group">
        <label>Playback</label>
        <div class="button-row">
          <button id="sim-pause" type="button">Pause</button>
          <button id="sim-reset" type="button">Reset</button>
          <a class="chip" href="../index.htm">Home</a>
        </div>
      </div>
    </section>

    <section class="plots">
      <div class="card plot-card">
        <header>
          <h2>Bed View</h2>
          <p>Single leg flexion from a supine position with a fixed bed line.</p>
        </header>
        <canvas id="sim-bed-canvas" width="900" height="520"></canvas>
      </div>
      <div class="card plot-card">
        <header>
          <h2>Joint Angles</h2>
          <p>Hip and knee flexion over one flex-extend cycle.</p>
        </header>
        <canvas id="sim-angle-canvas" width="520" height="520"></canvas>
      </div>
    </section>
  </main>

  <script src="legsim_06.js"></script>
</body>
</html>
